<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Barbe Club">
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a25a"/>
      <stop offset="1" stop-color="#a8652a"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="256" cy="256" r="196"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="248" fill="#151310"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#cu)" stroke-width="10"/>
  <circle cx="256" cy="256" r="208" fill="#1f1c18" stroke="#383129" stroke-width="4"/>
  <!-- listras de poste de barbeiro ao fundo -->
  <g clip-path="url(#disc)" opacity=".10" stroke="url(#cu)" stroke-width="26">
    <path d="M40 470 L470 40M-10 420 L420 -10M90 520 L520 90M140 570 L570 140M-60 370 L370 -60"/>
  </g>
  <!-- tesoura -->
  <g fill="url(#cu)" stroke="url(#cu)" stroke-linejoin="round" stroke-linecap="round">
    <!-- lâmina que sobe para a esquerda (cabo direito) -->
    <path d="M262 262 L178 92 L206 84 L286 236 Z" stroke-width="6"/>
    <!-- lâmina que sobe para a direita (cabo esquerdo) -->
    <path d="M250 262 L334 92 L306 84 L226 236 Z" stroke-width="6"/>
    <!-- hastes até os anéis -->
    <path d="M262 262 L322 348" fill="none" stroke-width="20"/>
    <path d="M250 262 L190 348" fill="none" stroke-width="20"/>
  </g>
  <!-- anéis dos cabos -->
  <g fill="none" stroke="url(#cu)" stroke-width="20">
    <circle cx="332" cy="378" r="36"/>
    <circle cx="180" cy="378" r="36"/>
  </g>
  <!-- fio de corte nas lâminas -->
  <path d="M205 100 L272 236M307 100 L240 236" stroke="#f3d3a8" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- pino central -->
  <circle cx="256" cy="262" r="12" fill="#151310" stroke="#f3d3a8" stroke-width="5"/>
</svg>
